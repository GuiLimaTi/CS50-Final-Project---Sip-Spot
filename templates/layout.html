<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sip Spot{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container nav-wrapper">
            <div class="brand-row">
                <a href="{{ url_for('index') }}" class="brand-link">
                    <img
                        src="{{ url_for('static', filename='images/logo-sip-spot-horizontal.png') }}"
                        alt="Sip Spot logo"
                        class="site-logo"
                    >
                </a>
            </div>

            <nav class="main-nav">
                <a href="{{ url_for('index') }}">Explore</a>
                <a href="{{ url_for('about') }}">About</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <p>Developed by Guilherme Lima ☕</p>
        </div>
    </footer>
</body>
</html>
